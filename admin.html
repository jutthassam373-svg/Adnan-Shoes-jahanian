
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADNAN SHOES | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#10131b;color:#fff;padding:20px}
.container{max-width:900px;margin:auto}
h1{color:#ffc344;text-align:center}
.card{background:#1b2230;padding:20px;border-radius:12px;margin:18px 0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #424b5c;border-radius:7px;background:#10131b;color:#fff}
button{padding:12px 16px;border:0;border-radius:7px;background:#ffc344;color:#111;font-weight:bold;cursor:pointer;margin:4px}
.danger{background:#d93636;color:#fff}
.muted{color:#b9c0ce;line-height:1.6}
#dashboard{display:none}
.product{border:1px solid #424b5c;padding:12px;border-radius:8px;margin:10px 0}
.product img{width:90px;height:75px;object-fit:cover;border-radius:6px;float:right}
#message{white-space:pre-wrap;color:#ffc344}
</style>
</head>
<body>
<div class="container">
<h1>ADNAN SHOES</h1>
<p style="text-align:center">JAHANIAN • ADMIN PANEL</p>

<div class="card" id="loginCard">
<h2>Admin Login</h2>
<p class="muted">Use the email and password of your existing Supabase account.</p>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required autocomplete="username">
<label>Password</label>
<input id="password" type="password" required autocomplete="current-password">
<button type="submit">LOGIN</button>
</form>
</div>

<div id="dashboard">
<div class="card">
<h2>Add / Update Shoe</h2>
<form id="productForm">
<input id="productId" type="hidden">
<label>Product Name</label>
<input id="name" required maxlength="100">
<label>Category</label>
<select id="category">
<option>Sneakers</option>
<option>Sports</option>
<option>Formal</option>
<option>Sandals</option>
<option>Casual</option>
</select>
<label>Price (PKR)</label>
<input id="price" type="number" min="0" step="1" required>
<label>Sizes (e.g. 40, 41, 42)</label>
<input id="sizes" required>
<label>Stock Quantity</label>
<input id="stock" type="number" min="0" step="1" required>
<label>Image URL</label>
<input id="image_url" type="url" placeholder="https://example.com/shoe.jpg">
<label>Description</label>
<textarea id="description" maxlength="500"></textarea>
<button type="submit">SAVE PRODUCT</button>
<button type="button" id="clearButton">CLEAR FORM</button>
</form>
</div>

<div class="card">
<h2>Products</h2>
<button id="refreshButton">REFRESH PRODUCTS</button>
<div id="productList"></div>
</div>

<button id="logoutButton" class="danger">LOG OUT</button>
</div>

<div class="card"><p id="message">Loading admin panel...</p></div>
<p class="muted">Store: Sadar Bazaar, Jahanian • WhatsApp: 0312-8622153</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
"use strict";

const message = document.getElementById("message");
const loginCard = document.getElementById("loginCard");
const dashboard = document.getElementById("dashboard");
const productList = document.getElementById("productList");

let client = null;
let adminId = null;

function say(text) {
  message.textContent = text;
}

function clearForm() {
  document.getElementById("productForm").reset();
  document.getElementById("productId").value = "";
}

function showLoggedOut() {
  loginCard.style.display = "block";
  dashboard.style.display = "none";
  adminId = null;
}

async function checkAdmin() {
  const { data: userData, error: userError } =
    await client.auth.getUser();

  if (userError || !userData.user) {
    showLoggedOut();
    say("Please log in with the authorized shop-owner account.");
    return false;
  }

  const { data, error } = await client
    .from("admin_users")
    .select("user_id")
    .eq("user_id", userData.user.id)
    .maybeSingle();

  if (error || !data) {
    showLoggedOut();
    say("This account is not authorized as an admin.");
    return false;
  }

  adminId = userData.user.id;
  loginCard.style.display = "none";
  dashboard.style.display = "block";
  say("Admin login successful.");
  await loadProducts();
  return true;
}

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (!client) {
    say("Configuration error. Check supabase-config.js.");
    return;
  }

  say("Logging in...");

  const { error } = await client.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });

  if (error) {
    say("Login failed: " + error.message);
    return;
  }

  await checkAdmin();
});

async function loadProducts() {
  const { data, error } = await client
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    say("Could not load products: " + error.message);
    return;
  }

  productList.replaceChildren();

  if (!data.length) {
    productList.textContent = "No products in database yet.";
    return;
  }

  data.forEach(product => {
    const item = document.createElement("div");
    item.className = "product";

    if (product.image_url) {
      const img = document.createElement("img");
      img.src = product.image_url;
      img.alt = product.name;
      img.onerror = () => img.remove();
      item.appendChild(img);
    }

    const title = document.createElement("strong");
    title.textContent = product.name;
    item.appendChild(title);

    const details = document.createElement("p");
    details.textContent =
      "Category: " + product.category +
      " | Price: Rs. " + product.price +
      " | Sizes: " + (product.sizes || "-") +
      " | Stock: " + product.stock +
      " | " + (product.active ? "Active" : "Hidden");
    item.appendChild(details);

    const edit = document.createElement("button");
    edit.textContent = "EDIT";
    edit.addEventListener("click", () => {
      document.getElementById("productId").value = product.id;
      document.getElementById("name").value = product.name;
      document.getElementById("category").value = product.category;
      document.getElementById("price").value = product.price;
      document.getElementById("sizes").value = product.sizes || "";
      document.getElementById("stock").value = product.stock;
      document.getElementById("image_url").value = product.image_url || "";
      document.getElementById("description").value = product.description || "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    item.appendChild(edit);

    const visibility = document.createElement("button");
    visibility.textContent = product.active ? "HIDE PRODUCT" : "SHOW PRODUCT";
    visibility.addEventListener("click", () => toggleProduct(product));
    item.appendChild(visibility);

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "DELETE";
    remove.addEventListener("click", () => deleteProduct(product));
    item.appendChild(remove);

    productList.appendChild(item);
  });
}

document.getElementById("productForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (!adminId) {
    say("Please log in as an authorized admin first.");
    return;
  }

  const id = document.getElementById("productId").value;
  const product = {
    name: document.getElementById("name").value.trim(),
    category: document.getElementById("category").value,
    price: Number(document.getElementById("price").value),
    sizes: document.getElementById("sizes").value.trim(),
    stock: Number(document.getElementById("stock").value),
    image_url: document.getElementById("image_url").value.trim() || null,
    description: document.getElementById("description").value.trim(),
    active: true
  };

  say("Saving product...");

  let result;
  if (id) {
    result = await client.from("products").update(product).eq("id", id);
  } else {
    result = await client.from("products").insert(product);
  }

  if (result.error) {
    say("Save failed: " + result.error.message);
    return;
  }

  say("Product saved successfully.");
  clearForm();
  await loadProducts();
});

async function toggleProduct(product) {
  if (!adminId) return;

  const { error } = await client
    .from("products")
    .update({ active: !product.active })
    .eq("id", product.id);

  if (error) {
    say("Update failed: " + error.message);
    return;
  }

  say("Product visibility updated.");
  await loadProducts();
}

async function deleteProduct(product) {
  if (!adminId) return;
  if (!confirm("Delete " + product.name + "? This cannot be undone.")) return;

  const { error } = await client
    .from("products")
    .delete()
    .eq("id", product.id);

  if (error) {
    say("Delete failed: " + error.message);
    return;
  }

  say("Product deleted.");
  await loadProducts();
}

document.getElementById("clearButton").addEventListener("click", clearForm);
document.getElementById("refreshButton").addEventListener("click", loadProducts);

document.getElementById("logoutButton").addEventListener("click", async () => {
  await client.auth.signOut();
  showLoggedOut();
  say("You are logged out.");
});

if (
  typeof window.supabase === "undefined" ||
  !window.SUPABASE_URL ||
  !window.SUPABASE_PUBLISHABLE_KEY ||
  window.SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
) {
  showLoggedOut();
  say("Setup needed: add your Supabase Project URL and publishable key to supabase-config.js.");
} else {
  client = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_PUBLISHABLE_KEY
  );

  checkAdmin();
}
</script>
</body>
</html>
